<svg role="img" aria-label="MOD-06 LAB RIG — threat research lab infrastructure, binary tooling, and crypto assurance" viewBox="0 0 900 270" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <title>MOD-06 // LAB RIG &amp; DISPATCH — Threat Research Infrastructure</title>
  <defs>
    <linearGradient id="m6panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="m6accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <radialGradient id="m6glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m6glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m6soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m6blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="m6scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m6clip"><rect x="14" y="14" width="872" height="242" rx="12"/></clipPath>
    <style>
      @keyframes m6pulse{0%,100%{opacity:1}50%{opacity:0.35}}
      @keyframes m6ping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.8);opacity:0}}
      @keyframes m6beam{0%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
      @keyframes m6caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes m6eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @keyframes m6breathe{0%,100%{opacity:.72}50%{opacity:.4}}
      .m6led{animation:m6pulse 2.2s ease-in-out infinite;transform-origin:center}
      .m6ping{animation:m6ping 2.7s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .m6beam{animation:m6beam 6.5s linear infinite}
      .m6caret{animation:m6caret 1s step-end infinite}
      .m6eqbar{animation:m6eq 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
      .m6breathe{animation:m6breathe 3.8s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){
        .m6led,.m6ping,.m6beam,.m6caret,.m6eqbar,.m6breathe{animation:none}
      }
    </style>
  </defs>

  <!-- panel background -->
  <rect x="14" y="14" width="872" height="242" rx="12" fill="url(#m6panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="239" rx="11" fill="none" stroke="#22d3ee" stroke-opacity="0.16"/>

  <g clip-path="url(#m6clip)">
    <!-- depth glows -->
    <ellipse cx="140" cy="50" rx="160" ry="110" fill="url(#m6glowC)" filter="url(#m6blur)" opacity="0.5"/>
    <ellipse cx="800" cy="230" rx="170" ry="120" fill="url(#m6glowM)" filter="url(#m6blur)" opacity="0.4"/>
    <rect x="14" y="14" width="872" height="242" fill="url(#m6scan)"/>
    <!-- scan beam -->
    <rect class="m6beam" x="14" y="14" width="130" height="242" fill="#22d3ee" opacity="0.04"/>
  </g>

  <!-- corner reticles -->
  <g class="m6breathe" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-opacity="0.7">
    <path d="M26 38 L26 26 L38 26"/>
    <path d="M862 26 L874 26 L874 38"/>
    <path d="M26 232 L26 244 L38 244"/>
    <path d="M862 244 L874 244 L874 232"/>
  </g>

  <!-- header -->
  <g>
    <circle class="m6ping" cx="40" cy="42" r="4" fill="none" stroke="#27c93f" stroke-width="1.3"/>
    <circle class="m6led" cx="40" cy="42" r="4" fill="#27c93f"/>
    <circle cx="40" cy="42" r="4" fill="none" stroke="#27c93f" stroke-opacity="0.4"/>
    <text x="54" y="46" fill="#22d3ee" font-size="12.5" font-weight="bold" letter-spacing="2" filter="url(#m6soft)">MOD-06 // LAB RIG &amp; DISPATCH</text>
    <!-- signal bars (equalizer) -->
    <g fill="#22d3ee" opacity="0.8">
      <rect class="m6eqbar" x="772" y="35" width="3" height="13"/>
      <rect class="m6eqbar" x="777" y="35" width="3" height="13" style="animation-delay:-.3s"/>
      <rect class="m6eqbar" x="782" y="35" width="3" height="13" style="animation-delay:-.6s"/>
      <rect class="m6eqbar" x="787" y="35" width="3" height="13" style="animation-delay:-.85s"/>
    </g>
    <text x="862" y="46" fill="#7d8590" font-size="11" letter-spacing="1" text-anchor="end">~/lab/telemetry</text>
  </g>
  <line x1="26" y1="58" x2="874" y2="58" stroke="#283246" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12">
    <text x="30" y="78">
      <tspan fill="#27c93f">tmqahihi@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> ./threat_lab.sh </tspan><tspan fill="#ff5cf2">--matrix=hardened</tspan>
    </text>
    <rect class="m6caret" x="376" y="68" width="7" height="13" fill="#22d3ee"/>
  </g>

  <!-- 4 Lab Nodes Grid (2x2) -->
  <!-- Node 01 -->
  <g font-size="11">
    <rect x="26" y="92" width="418" height="60" rx="6" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="42" cy="110" r="3.5" fill="#27c93f"/>
    <text x="52" y="113" fill="#22d3ee" font-weight="bold" font-size="11.5">NODE-01 // ISOLATED SANDBOX</text>
    <rect x="360" y="102" width="74" height="16" rx="8" fill="#27c93f" opacity="0.12" stroke="#27c93f" stroke-opacity="0.4"/>
    <text x="397" y="114" fill="#27c93f" font-size="9" text-anchor="middle" font-weight="bold">ARMED</text>
    <text x="42" y="132" fill="#9aa6b8" font-size="10.5">FlareVM (Win11 Ent) · REMnux v7.0 · Type-1 Proxmox VE</text>
    <text x="42" y="144" fill="#566072" font-size="9.5">Differential snapshot rollback · Isolated VLAN ring</text>
  </g>

  <!-- Node 02 -->
  <g font-size="11">
    <rect x="456" y="92" width="418" height="60" rx="6" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="472" cy="110" r="3.5" fill="#22d3ee"/>
    <text x="482" y="113" fill="#22d3ee" font-weight="bold" font-size="11.5">NODE-02 // STATIC RECON &amp; DISASSEMBLY</text>
    <rect x="790" y="102" width="74" height="16" rx="8" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="827" y="114" fill="#22d3ee" font-size="9" text-anchor="middle" font-weight="bold">INDEXED</text>
    <text x="472" y="132" fill="#9aa6b8" font-size="10.5">IDA Pro 9.x · Ghidra 11 · Binary Ninja · PE-bear · CAPA</text>
    <text x="472" y="144" fill="#566072" font-size="9.5">AST structural analysis · Section entropy verification</text>
  </g>

  <!-- Node 03 -->
  <g font-size="11">
    <rect x="26" y="160" width="418" height="60" rx="6" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="42" cy="178" r="3.5" fill="#ff5cf2"/>
    <text x="52" y="181" fill="#22d3ee" font-weight="bold" font-size="11.5">NODE-03 // DYNAMIC TRACE &amp; HOOKING</text>
    <rect x="360" y="170" width="74" height="16" rx="8" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.4"/>
    <text x="397" y="182" fill="#ff5cf2" font-size="9" text-anchor="middle" font-weight="bold">LISTENING</text>
    <text x="42" y="200" fill="#9aa6b8" font-size="10.5">Frida DBI · x64dbg · WinDbg Preview · Process Hacker 2</text>
    <text x="42" y="212" fill="#566072" font-size="9.5">VEH Hardware Breakpoints (DR0-DR3) · Syscall Jitter</text>
  </g>

  <!-- Node 04 -->
  <g font-size="11">
    <rect x="456" y="160" width="418" height="60" rx="6" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="472" cy="178" r="3.5" fill="#ffbd2e"/>
    <text x="482" y="181" fill="#22d3ee" font-weight="bold" font-size="11.5">NODE-04 // CRYPTO &amp; PROTOCOL ASSURANCE</text>
    <rect x="790" y="170" width="74" height="16" rx="8" fill="#ffbd2e" opacity="0.12" stroke="#ffbd2e" stroke-opacity="0.4"/>
    <text x="827" y="182" fill="#ffbd2e" font-size="9" text-anchor="middle" font-weight="bold">SECURED</text>
    <text x="472" y="200" fill="#9aa6b8" font-size="10.5">PGP 4096R RSA Verified · RFC 9116 security.txt Compliant</text>
    <text x="472" y="212" fill="#566072" font-size="9.5">Wireshark · Burp Suite Pro · ProtonMail E2EE Pipe</text>
  </g>

  <!-- footer -->
  <line x1="26" y1="228" x2="874" y2="228" stroke="#1b2230" stroke-width="1"/>
  <text x="42" y="246" fill="#566072" font-size="10.5" letter-spacing="0.5"># 4 LAB NODES OPERATIONAL · ZERO-RESIDUAL TAILS ENFORCED</text>
  <text x="862" y="246" fill="#566072" font-size="10" text-anchor="end" opacity="0.7">0x7F454C46 // 0x4D5A9000 [PE/ELF]</text>
</svg>
