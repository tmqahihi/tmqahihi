name: Autonomous Research Dispatch & Telemetry Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dispatches:
    name: Sync Security Research Dispatches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📡 Refresh Research Logs & Feeds
        shell: python
        run: |
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone

          readme_path = Path("README.md")
          if not readme_path.exists():
            print("[-] Error: README.md missing", file=sys.stderr)
            sys.exit(1)

          content = readme_path.read_text(encoding="utf-8")
          pattern = r"(<!-- RESEARCH-DISPATCH:START -->)(.*?)(<!-- RESEARCH-DISPATCH:END -->)"
          
          # Default verified telemetry feed entries if remote endpoint is offline
          default_entries = [
              "[DISPATCH 01] CVE/RESEARCH  :: Windows Internals & Direct Syscall Evasion (Halo/Tartarus Gate)",
              "[DISPATCH 02] MEM-FORENSICS :: Patchless VEH Blinding & Hardware Breakpoints (DR0-DR3)",
              "[DISPATCH 03] LAB-TELEMETRY :: Autonomous Zero-Residual Malware Triage Pipeline (FlareVM)",
              "[DISPATCH 04] DEFENSE-OPSEC :: Synthetic Call Stack Spoofing & Return Address Camouflage"
          ]

          feed_urls = [
              "https://TonMinhQuan.software/index.xml",
              "https://TonMinhQuan.software/feed.xml",
              "https://TonMinhQuan.software/rss.xml"
          ]

          entries = []
          for url in feed_urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Security-Bot/1.0)"})
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      if resp.status == 200:
                          tree = ET.fromstring(resp.read())
                          items = tree.findall(".//item") or tree.findall(".//entry")
                          for idx, item in enumerate(items[:4], start=1):
                              title = item.findtext("title") or "Untitled Dispatch"
                              entries.append(f"[DISPATCH 0{idx}] ADVISORY     :: {title}")
                          if entries:
                              break
              except Exception:
                  continue

          if not entries:
              entries = default_entries

          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          dispatches_text = "\n".join(entries)
          rendered_block = f"\n<pre><code>{dispatches_text}</code></pre>\n<sub><i>Telemetry refreshed automatically via GitHub Actions Pipeline ({now_utc})</i></sub>\n"

          new_content = re.sub(pattern, f"\\1{rendered_block}\\3", content, flags=re.DOTALL)
          if new_content != content:
              readme_path.write_text(new_content, encoding="utf-8")
              print("[+] Updated README.md with fresh security research telemetry.")
          else:
              print("[*] No changes detected in telemetry block.")

      - name: 💾 Commit & Push Telemetry (Auto-Skip If Clean)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): update research dispatches [skip ci]"
            git push
          else
            echo "Working tree clean, nothing to commit."
          fi
