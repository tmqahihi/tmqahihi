name: Generate Ultra Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tmqahihi
          outputs: |
            dist/github-snake.svg?color_snake=#00f0ff&color_dots=#ebedf0,#c084fc,#a855f7,#7e22ce,#3b0764
            dist/github-snake-dark.svg?color_snake=#facc15&color_dots=#0f172a,#581c87,#7e22ce,#c084fc,#f472b6

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
