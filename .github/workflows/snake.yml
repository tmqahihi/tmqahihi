name: Generate Ultra Snake Animation

on:
  schedule:
    # Tự động vẽ lại đường chạy mới mỗi 6 tiếng
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tmqahihi
          outputs: |
            dist/github-snake.svg?color_snake=#00f0ff&color_dots=#ebedf0,#fecaca,#f87171,#ef4444,#ff0033
            dist/github-snake-dark.svg?color_snake=#00f0ff&color_dots=#0d1117,#450a0a,#991b1b,#dc2626,#ff003f

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
